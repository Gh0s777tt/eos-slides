[package]
name = "eos-slides"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Presentation editor for E-OS — slides, outline and full-screen show."
repository = "https://gitlab.com/e-os/eos-slides"
build = "build.rs"

[[bin]]
name = "eos-slides"
path = "src/main.rs"

[dependencies]
# Slint drives the widgets; the Redox backend (software renderer over orbclient)
# and the font bootstrap live in the shared eos-ui crate. Feature set copied
# verbatim from eos-notes — `renderer-software` is the only renderer that works
# under Orbital, and `compat-1-0` keeps the 1.x language semantics.
slint = { version = "1.17", default-features = false, features = ["compat-1-0", "std", "renderer-software"] }
eos-ui = { git = "https://gitlab.com/e-os/eos-ui.git", rev = "9fb3f3e4a3ecf1c152b03662db0723869206e5d6" }

# Host window backend. Two facts decide the shape of this section:
#   1. cargo refuses the same crate under two names in one package
#      ("depends on crate `slint` v1.17.1 multiple times with different names"),
#      so the host backend cannot be a renamed second `slint` entry;
#   2. a feature that switched `slint/backend-winit` on would switch it on for
#      *every* target, Redox included.
# Depending on the backend crate itself, target-scoped and optional, gives both
# properties: Redox never resolves this section, and the host build only pulls
# winit when it is asked to.
[target.'cfg(not(target_os = "redox"))'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software"], optional = true }

# Linux/BSD hosts additionally need the display-server features; macOS does not.
# [UNVERIFIED]: measured on macOS only — no Linux host was available.
[target.'cfg(all(unix, not(target_os = "redox"), not(target_os = "macos")))'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software", "x11", "wayland"], optional = true }

# Windows needs `muda` — and not because we want a menu bar. In
# i-slint-backend-winit 1.17.1 the field `WinitWindowOrNone::HasWindow.muda_adapter`
# is declared `#[cfg(muda)]` (build.rs: `muda = all(feature = "muda", any(windows,
# macos))`), while the pattern that destructures it at winitwindowadapter.rs:916 is
# gated only `#[cfg(target_os = "windows")]`. `muda` is an *implicit* feature — an
# optional dependency that is not listed in [features] — so it is off by default and
# the two cfgs disagree. Measured before this line existed:
#   error[E0026]: variant `WinitWindowOrNone::HasWindow` does not have a field
#                 named `muda_adapter`
# Turning `muda` on for Windows only makes the two cfgs agree again. It is a
# workaround for an upstream bug, not a product decision; delete it when 1.18
# fixes the gate.
[target.'cfg(target_os = "windows")'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software", "muda"], optional = true }

# Linux needs fontconfig at *runtime*, not at *link* time. `i-slint-common` is not
# used by this crate's code; it is here so that cargo's feature unification applies
# `fontconfig-dlopen` to the copy the rest of the graph already pulls in. Without
# it a cross build from macOS dies in a transitive build script:
#   error: failed to run custom build command for `yeslogic-fontconfig-sys v6.0.0`
#   pkg-config has not been configured to support cross-compilation
# The version is pinned `=1.17.1` on purpose: feature unification only happens when
# both paths resolve to the SAME version, so a floating `1.17` that drifted to
# 1.17.2 would silently stop applying the feature and the failure would come back
# looking like a fontconfig problem again.
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "=1.17.1", default-features = false, features = ["fontconfig-dlopen"], optional = true }

[features]
# Fail-closed: the default build carries no windowing backend, so a Redox cross
# build cannot pick one up by accident and a CI container needs no display libs.
# `--features host-backend` is the explicit escape that opens a real window on
# Linux/macOS/Windows.
default = []
# `dep:i-slint-common` resolves to nothing on macOS, Windows and Redox — the
# dependency is target-scoped to Linux — so this stays one feature, not two.
host-backend = ["dep:i-slint-backend-winit", "dep:i-slint-common"]

[build-dependencies]
slint-build = "1.17"

[profile.release]
# E-OS hardening baseline (matches the code forks): an unintended integer
# overflow aborts instead of wrapping silently.
overflow-checks = true
