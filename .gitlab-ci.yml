# eos-slides CI.
#
# Two tiers, and the split is not cosmetic. gitlab.com shared minutes for this
# group run out with interruptions (CLAUDE.md §9), so the tier that must always
# be able to run is the one on our own macOS runner, tag `eos-heavy`.
#
#   light  — secret scan, fmt, clippy, test, coverage, cargo-deny,
#            osv-scanner. Shared runners, default features (no windowing
#            backend, so no display libraries are needed).
#   heavy  — the host GUI build and its runtime proof, on `eos-heavy`.
#
# No job carries `allow_failure` — a gate that cannot go red is decoration
# (CLAUDE.md §13).
#
# Two supply-chain databases, not one, and they are not redundant: cargo-deny
# walks the RESOLVED FEATURE GRAPH, osv-scanner reads Cargo.lock. Measured on
# this tree — `cargo deny check advisories` says "advisories ok" while
# `osv-scanner scan source --lockfile Cargo.lock` reports RUSTSEC-2025-0141
# (bincode), which sits in the lockfile behind an optional feature nobody
# enables. The meta-repo learned the same lesson as C-13. The second reason for
# both is expiry: cargo-deny 0.20.2 accepts only `id` and `reason` under
# [[advisories.ignore]], so only osv-scanner.toml's `ignoreUntil` can make an
# exception come back on its own.
#
# Line width: this file AIMED at 80 columns so that plain `yamllint` (no
# configuration file, which is what a reviewer runs) exits 0, and it no longer
# holds -- the PR-008 packaging commit added 26 lines over the limit and
# nothing caught it, because no job in this repository runs yamllint. Measured
# 2026-09-03: `yamllint .gitlab-ci.yml` reports 26 `line-length` errors both
# before and after this commit, so the sweep adds none. Recorded here instead
# of quietly deleted: a promise a file makes about itself and does not keep is
# worth more visible than absent.
---
# ONE PIPELINE PER PUSH, NOT TWO (meta-repo ROADMAP `RH-017`).
# Measured 2026-09-03: every push produced a `push` pipeline AND a
# `merge_request_event` pipeline, both running the same jobs. On shared runners
# that is invisible -- they die on quota either way. It stops being invisible
# the moment a job does real work: the same ~20-minute cross build ran twice
# per push on a runner with `concurrent = 1`, so the duplicate did not merely
# waste time, it delayed every job behind it.
#
# This is the SECOND shape of the rule. The first was GitLab's own documented
# template, `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUEST_IID` -> `when: never`,
# and in this group it deduplicated nothing: that variable is not populated in
# these branch pipelines, so the `never` arm never matched. The rule below says
# what it means instead of leaning on a variable nobody here can observe.
#
# The trade, stated rather than discovered: a branch pushed WITHOUT a merge
# request gets no pipeline at all. Branch-then-merge-request is the norm here.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - light
  - heavy
  - package
  - checks

variables:
  CARGO_TERM_COLOR: "always"
  # Keeps the git dependency (eos-ui) fetch reproducible in a fresh container.
  CARGO_NET_RETRY: "3"

default:
  interruptible: true

# One copy of the trigger rules. Every job extends this, directly or via
# `.light`; a second copy of a rule is a copy that goes stale (CLAUDE.md §13.1).
.rules-light:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.light:
  extends: .rules-light
  stage: light
  image: "rust:slim"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - rustc --version && cargo --version

# First job of the pipeline, as in the meta-repo (CLAUDE.md §13): a leaked
# credential is the one finding that is already too late by the time the tests
# run. No `--config`: the default rule set is the stricter one, and this tree
# has nothing that trips it (measured: "no leaks found").
secret-scan:
  stage: light
  extends: .rules-light
  image:
    name: "zricethezav/gitleaks:latest"
    entrypoint: [""]
  variables:
    # Full history. GitLab's default shallow clone would hide a secret that was
    # committed and then removed in a later commit, which is the usual case.
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --no-banner --redact -v

fmt:
  extends: .light
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

clippy:
  extends: .light
  script:
    - rustup component add clippy
    # --all-targets covers the tests too; -D warnings lets the gate fail.
    - cargo clippy --locked --all-targets -- -D warnings

test:
  extends: .light
  script:
    - cargo test --locked
    # The marker the boot probe greps for must also be produced on the host.
    # Not `cargo run | grep`: a pipe returns grep's status, so a crash in
    # cargo run would be judged by grep (CLAUDE.md P-3). Capture, then grep.
    - cargo run --locked -- --selftest > selftest.log
    - grep -q 'EOS-SLIDES-SELFTEST-OK' selftest.log

# CLAUDE.md §5.10 applies to E-OS-owned code, and a type-A product repository
# is that. The floor is a REGRESSION catch, not a certificate: 55 is the line
# coverage measured on a freshly generated tree (55.35% — model.rs 88.15%,
# main.rs 0.00%, because main.rs is the GUI entry point and is exercised by
# --selftest in the `test` job rather than by a unit test). Raising it is an
# ordinary commit; lowering it needs the owner's agreement and a reason in the
# commit body. Proven able to fail: at --fail-under-lines 60 the same tree
# exits 1. Measured caveat worth knowing before you debug a red pipeline —
# cargo-llvm-cov 0.6 prints NO message for this; the only signal is the exit
# code and the TOTAL row of the table it printed anyway.
coverage:
  extends: .light
  script:
    - rustup component add llvm-tools-preview
    - cargo install --locked cargo-llvm-cov
    - cargo llvm-cov --locked --fail-under-lines 55

deny:
  extends: .light
  script:
    - cargo install --locked cargo-deny
    - cargo deny check

# The lockfile half of the supply chain; see the header for why both run.
# `go install <pkg>@<version>` is version-pinned and its module checksums are
# verified against sum.golang.org, so no hand-maintained binary hash is needed.
osv-scanner:
  stage: light
  extends: .rules-light
  image: "golang:1-alpine"
  variables:
    OSV_SCANNER_VERSION: "v2.2.3"
  script:
    - apk add --no-cache git
    - >-
      go install
      github.com/google/osv-scanner/v2/cmd/osv-scanner@$OSV_SCANNER_VERSION
    # Reads ./osv-scanner.toml. Every entry there carries an `ignoreUntil`, so
    # the exception expires and the finding returns instead of hiding.
    - osv-scanner scan source --lockfile Cargo.lock

# Runs on the operator's Mac (tag `eos-heavy`): the only runner that is not
# subject to the shared-minutes quota, and the only host where the winit
# backend build has actually been measured.
.host-toolchain:
  # THE ONE PLACE THAT KNOWS WHERE CARGO IS. rustup on this runner is Homebrew's, so cargo is NOT
  # in ~/.cargo/bin, and the gitlab-runner shell executor does not read a login profile. Before this
  # job existed the same two lines were pasted into `.package` and `checks-heavy`, each with a
  # comment saying they had been learned the expensive way -- and `host-gui`, which got neither
  # copy, failed with `cargo: command not found` (exit 127) on every pipeline it was ever part of.
  # A rule kept in copies drifts, and the copy that is missing is the one that breaks (CLAUDE.md
  # section 13.1). `command -v` is the check on the check: if cargo stops being on PATH, the job
  # goes red HERE with a name, instead of somewhere further down with a confusing message.
  before_script:
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$PATH"
    - command -v cargo
    # AND WHERE THE BUILD TREE GOES, for the same reason the PATH line is here. This runner's
    # internal disk has been measured at 98-100 %% full; /Volumes/EOS-Podman has ~95 GiB. Both
    # `checks-heavy` and the packaging jobs already redirected `target` there -- and `host-gui`,
    # once again, did not. The first pipeline in which `host-gui` was able to run at all died on
    # `rustc-LLVM ERROR: IO failure on output stream: No space left on device`. A symlink rather
    # than CARGO_TARGET_DIR so every tool agrees where things are.
    - if [ -n "${EOS_XBUILD:-}" ]; then mkdir -p "$EOS_XBUILD" "${TMPDIR:-/tmp}"; rm -rf target; ln -s "$EOS_XBUILD" target; fi

host-gui:
  variables:
    TMPDIR: "/Volumes/EOS-Podman/tmp"
    EOS_XBUILD: "/Volumes/EOS-Podman/xbuild/eos-slides-ci-hostgui"
  stage: heavy
  extends: .rules-light
  tags:
    - eos-heavy
  # Without this the job is SKIPPED, not run: it sits in a stage after
  # jobs that die on `ci_quota_exceeded`, and GitLab skips the rest of
  # the pipeline. Measured on the last `main` pipeline before this
  # commit -- `host-gui` came back `skipped` while the repository looked
  # like it had CI. Removing this line loses the job silently rather
  # than failing it (meta-repo ROADMAP `RH-018`).
  needs: []
  before_script:
    - !reference [.host-toolchain, before_script]
  script:
    - cargo build --locked --features host-backend
    # Proves the backend is live, not merely linked: the window is constructed
    # and dropped without entering the event loop.
    - >-
      cargo run --locked --features host-backend -- --check-backend
      > backend.log
    - grep -q 'EOS-SLIDES-BACKEND-OK' backend.log
    # Negative side of the same gate: without the feature the binary must
    # refuse with exit code 2 (could not run), not pretend to succeed.
    - |
      if cargo run --locked -- --check-backend; then
        echo "FAIL: --check-backend succeeded without host-backend"
        exit 1
      fi

# Downloadable, per-OS builds — roadmap PR-008.
#
# What these two jobs claim is narrow, and worth stating exactly: someone on
# Windows or on Linux can fetch ONE file from a pipeline and run this
# application without installing a Rust toolchain. The E-OS build is still
# the real product (README, "For E-OS"); this is the same "development
# convenience" the `host-gui` job covers, with a file attached to it.
#
# Why `eos-heavy` and not a shared runner. Both jobs cross-compile the whole
# Slint graph from a cold cache — measured on the operator's Mac 2026-09-03,
# 16m37s for Windows and 17m19s for Linux. Shared minutes for this group run
# out with interruptions (CLAUDE.md §9), and a packaging job that cannot be
# run is not a packaging job.
#
# Why a third stage rather than two more `heavy` jobs. Stages are ordered, so
# `package` starts only after `host-gui` has shown that the winit backend
# really constructs a window on this host. Publishing an archive that was
# never shown to work is exactly the "a green build is not evidence" mistake
# of CLAUDE.md §5.3.
#
# Why both jobs run `--selftest` before packaging anything. The two checks
# inside release.sh — binary format via `file`, and a 1 MiB size floor — are
# the only thing standing between a broken build and a published archive, and
# a check nobody has seen refuse is a hypothesis, not a gate (§5.4).
# `--selftest` hands those checks fabricated files (a text file, 2 MiB of
# zeroes, a 512 KB stub, a file that is not there) and exits non-zero if any
# one of them is accepted. So the job also goes red when the GATE rots, not
# only when the build breaks.
#
# These jobs go red for the build too, and that was measured on this tree
# rather than assumed. Delete the `muda` line from Cargo.toml and the Windows
# build stops with `error[E0026]: variant WinitWindowOrNone::HasWindow does
# not have a field named muda_adapter`. Delete the `i-slint-common` line and
# the Linux build stops in yeslogic-fontconfig-sys 6.0.1's build script with
# "pkg-config has not been configured to support cross-compilation". Both
# were reproduced by removing the line, rebuilding, and putting it back.
#
# --------------------------------------------------------------------------
# READ THIS BEFORE WONDERING WHY `package-linux` IS RED.
#
# On the macOS `eos-heavy` runner it IS red, and the cause is the packager,
# not this product. release.sh routes only `*windows-gnu` through
# `cargo zigbuild`; every other target falls through to a plain `cargo build`,
# so rustc hands the link to Apple's `cc` and thence to Apple's `ld`, which
# does not speak GNU linker flags. Measured here, after the entire dependency
# graph had already compiled cleanly:
#
#   ld: unknown options: --as-needed -Bstatic -Bdynamic --eh-frame-hdr -z
#       --gc-sections -z -z --strip-debug
#   clang: error: linker command failed with exit code 1
#
# The Linux BINARY is fine. `cargo zigbuild --release --features host-backend
# --target x86_64-unknown-linux-gnu` produced a 17 001 800 byte "ELF 64-bit
# LSB pie executable, x86-64 ... stripped" on this same host in 17m19s. What
# is missing is a Linux branch in release.sh, or a Linux executor on this
# runner. release.sh is a shared template copied verbatim into every product
# repository, so patching it here would fork it; that change belongs upstream
# of this merge request, and this job is what makes the gap visible.
#
# Left able to go red rather than papered over with `allow_failure: true`,
# which this file does not use anywhere and which CLAUDE.md §13 calls
# decoration.
# --------------------------------------------------------------------------
#
# What the runner must already have: `zig` and `cargo-zigbuild`. release.sh
# exits **2** — "the packager could not run" — when either is missing, which
# is deliberately a different colour of failure from exit 1, "the package is
# wrong" (CLAUDE.md §13).
#
# The archives are NOT signed and the artifacts expire. Signing product
# downloads needs a key a human generates and holds outside this repository
# (CLAUDE.md §14, §19); nothing here should be mistaken for a release.
.package:
  extends: .rules-light
  stage: package
  tags:
    - eos-heavy
  # `needs: []` DETACHES THIS FROM STAGE ORDERING, and it is the difference between a
  # gate and a decoration. Measured on the sibling products before this was added: the
  # package jobs came back **skipped** — not failed, not passed. The light-tier jobs above
  # run on shared runners that are out of quota, they die in ~0 s, and GitLab then skips
  # every later stage. A skipped job reads exactly like a job with nothing to complain about.
  needs: []
  variables:
    TMPDIR: "/Volumes/EOS-Podman/tmp"
  before_script:
    # rustup here is Homebrew's, so cargo is NOT in ~/.cargo/bin. The meta-repository's
    # `local-gates` job learned that as `cargo: command not found`.
    - !reference [.host-toolchain, before_script]
    - command -v cargo zig cargo-zigbuild python3 file
    # Idempotent and cheap: lets the job survive a re-imaged runner instead of
    # failing with a message about a missing std for the target.
    - rustup target add "$EOS_TARGET"
    # A symlink rather than CARGO_TARGET_DIR, because `release.sh` addresses the binary as
    # `target/<triple>/release/…` and would otherwise look where the file is not. It has to
    # go somewhere other than the default because this runner's internal disk was measured
    # at 96-99 %% full twice on 2026-09-03 (CLAUDE.md P-16, §21.1).
    - mkdir -p "$EOS_XBUILD" "$TMPDIR"
    - rm -rf target dist && ln -s "$EOS_XBUILD" target
    # The packager's own checks come first: if they stop being able to refuse anything,
    # nothing should be packaged at all (CLAUDE.md §5.4).
    - bash packaging/release.sh --selftest
  script:
    - bash packaging/release.sh "$EOS_TARGET" dist
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    # Long enough to download from a merge request, short enough that nobody
    # starts treating a pipeline artefact as a distribution channel.
    expire_in: 1 week

package-windows:
  extends: .package
  variables:
    EOS_TARGET: "x86_64-pc-windows-gnu"
    TMPDIR: "/Volumes/EOS-Podman/tmp"
    EOS_XBUILD: "/Volumes/EOS-Podman/xbuild/eos-slides-ci-windows"

# NO LONGER EXPECTED RED. The commit that added this job said `release.sh` routed only
# `*windows-gnu` through cargo zigbuild, so this target reached Apple's ld and failed at
# link after the whole graph had compiled. That was measured and true. The shared template
# has since been fixed to decide by triple (`needs_zig`, covering windows-gnu, linux-gnu
# and linux-musl), with those cases in `--selftest` so the routing is checked without
# waiting for a build. Measured through the packager on the sibling product eos-sheets:
#   release: dist/eos-sheets-0.1.0-x86_64-unknown-linux-gnu.tar.gz  7665902 bytes
#            (ELF 64-bit LSB pie executable, x86-64 ... for GNU/Linux 2.0.0, stripped)
package-linux:
  extends: .package
  variables:
    EOS_TARGET: "x86_64-unknown-linux-gnu"
    TMPDIR: "/Volumes/EOS-Podman/tmp"
    EOS_XBUILD: "/Volumes/EOS-Podman/xbuild/eos-slides-ci-linux"

# ───────────────────────  THE GATES THAT HAD NEVER RUN  ───────────────────────
# Measured 2026-09-03 on the last `main` pipeline of this repository: every
# quality job died in ~0 s with `ci_quota_exceeded`, so fmt, clippy, the test
# suite and the coverage floor have NEVER executed on a merge request -- not
# once. The YAML looked complete and the pipeline looked busy, which is exactly
# why nobody noticed (meta-repo ROADMAP `RH-018`; section 13: a check that
# cannot execute does not exist).
#
# This job is the same gates on the runner that actually runs. It does not
# replace the light tier: when shared minutes come back, those jobs are still
# the cheaper place for this work, and duplication that is measured beats a gap
# that is not.
#
# WHY COVERAGE IS MEASURED IN TWO PASSES. `cargo llvm-cov` alone reports what
# `cargo test` exercises. In this ecosystem the functional proof of a GUI
# product is its `--selftest` binary, which `cargo test` never runs -- so the
# instrument was pointed at the wrong runner and answered accordingly.
# Measured on this exact tree, both numbers:
#
#   eos-sheets/slides/drive/store   test only 55.35 %   +selftest 64.19 %
#   eos-notes                       test only  0.00 %   +selftest 39.64 %
#   eos-guard                       test only  0.00 %   +selftest 63.15 %
#
# Three products reading 0.00 % were not untested; the measurement was.
# Section 4.2 -- check the instrument before believing a negative result.
checks-heavy:
  stage: checks
  tags: [eos-heavy]
  # Same reason as the packaging jobs: without this the job is skipped whenever
  # the shared-runner jobs above die, which is every pipeline.
  needs: []
  timeout: 40m
  variables:
    TMPDIR: "/Volumes/EOS-Podman/tmp"
    EOS_XBUILD: "/Volumes/EOS-Podman/xbuild/eos-slides-ci-checks"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # Homebrew's rustup keeps cargo OUTSIDE ~/.cargo/bin. The meta-repo's
    # `local-gates` job learned that the expensive way: "cargo: not found".
    - !reference [.host-toolchain, before_script]
    - command -v cargo python3
    - mkdir -p "$EOS_XBUILD" "$TMPDIR"
    # The internal disk has been measured at 92-99 % full; /Volumes/EOS-Podman
    # has room. `target` is a symlink rather than CARGO_TARGET_DIR so that
    # every tool agrees about where things are.
    - rm -rf target && ln -s "$EOS_XBUILD" target
    # A missing tool must FAIL, not skip: a coverage floor that silently does
    # not run is the whole defect this job exists to fix.
    - rustup component add llvm-tools-preview
    - command -v cargo-llvm-cov || cargo install --locked cargo-llvm-cov
  script:
    - cargo fmt -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked
    - cargo llvm-cov clean --workspace
    - cargo llvm-cov --no-report --locked
    # The second pass: the selftest binary, where the functional proof lives.
    - cargo llvm-cov --no-report --locked run -- --selftest
    # The floor is the one this repository already declared. It had never
    # been evaluated: the job carrying it died on `ci_quota_exceeded` on
    # every pipeline before this commit.
    - cargo llvm-cov report --summary-only --fail-under-lines 55
